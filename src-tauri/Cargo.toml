[package]
name = "oasis-companion"
version = "1.260818.8"
description = "Oasis Companion desktop assistant for the oasis-wiki Skill"
authors = ["Oasis Wiki"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name from colliding with the binary name.
name = "oasis_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sysinfo = "0.30"
dirs = "5"
log = "0.4"
tokio = { version = "1", features = ["time", "sync"] }
zip = "2"
base64 = "0.22"
mime_guess = "2"
url = "2"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# Smaller binaries for a tray-resident app.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
